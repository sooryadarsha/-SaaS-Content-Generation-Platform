<!DOCTYPE html>
<html>
<head>

<title>Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
{% load static %}
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
    <nav class="navbar navbar-dark bg-dark">
<div class="container">

<a class="navbar-brand" href="/dashboard/">
AI Content Generator
</a>

<div>

<a href="/dashboard/" class="btn btn-light">
Dashboard
</a>

<a href="/generate/" class="btn btn-warning">
Generate
</a>

<a href="/history/" class="btn btn-info">
History
</a>

<a href="/logout/" class="btn btn-danger">
Logout
</a>

</div>

</div>
</nav>
<div class="container mt-3">

<h4>
Welcome, {{ request.user.username }}
</h4>

</div>

<div class="container mt-5">

<h1 class="mb-4">
Dashboard
</h1>

<div class="row">

<div class="col-md-3">

<div class="card text-center">

<div class="card-body">

<h3>{{ total_contents }}</h3>

<p>Total Contents</p>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card text-center">

<div class="card-body">

<h3>{{ blogs }}</h3>

<p>Blogs</p>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card text-center">

<div class="card-body">

<h3>{{ emails }}</h3>

<p>Emails</p>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card text-center">

<div class="card-body">

<h3>{{ social_posts }}</h3>

<p>Social Posts</p>


</div>

</div>

</div>
<div class="col-md-3 mt-4">

<div class="card text-center">

<div class="card-body">

<h3>{{ marketing_contents }}</h3>

<p>Marketing</p>

</div>

</div>

</div>
</div>

</div>

</body>
</html>
